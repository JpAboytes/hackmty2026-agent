[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fluidbank-orchestrator"
version = "0.1.0"
description = "LangGraph orchestrator that fetches Supabase-backed context via MCP and relays MCP-produced A2UI content to the mobile client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "fastmcp>=4.0.3,<5",
    "google-genai>=1.0,<2",
    "langgraph>=0.6,<1",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fluidbank_orchestrator"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
