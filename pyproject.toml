[project]
name = "fluidbank-orchestrator"
version = "0.1.0"
description = "LangGraph orchestrator for validated A2UI banking payloads"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "fastmcp>=4.0.3,<5",
    "google-genai>=1.0,<2",
    "langgraph>=0.6,<1",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
